<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .ReplaceName}}Replace credential{{else}}Add credential{{end}} · Agent Secrets</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="page-title">
      <header>
        <div class="brand"><span aria-hidden="true"></span>Agent Secrets</div>
        <h1 id="page-title">{{if .ReplaceName}}Replace credential{{else}}Add credential{{end}}</h1>
        <p>The value is encrypted locally. Your agent receives only its reference.</p>
      </header>

      {{if .Reason}}<p class="reason"><strong>Requested for</strong> {{.Reason}}</p>{{end}}

      <form method="post" action="/save" autocomplete="off">
        <input type="hidden" name="token" value="{{.Token}}">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" value="{{.Metadata.Name}}" maxlength="1024" placeholder="Development API" required autofocus>
        </div>
        <div class="pair">
          <div class="field"><label for="service">Service</label><input id="service" name="service" value="{{.Metadata.Service}}" maxlength="1024" placeholder="GitHub" required></div>
          <div class="field"><label for="environment">Environment</label><input id="environment" name="environment" value="{{.Metadata.Environment}}" maxlength="1024" placeholder="Development" required></div>
        </div>
        <div class="field">
          <label for="description">Description <span>Optional</span></label>
          <input id="description" name="description" value="{{.Metadata.Description}}" maxlength="1024" placeholder="What this credential is used for">
        </div>
        <div class="field">
          <label for="suggested_env">Environment variable <span>Optional</span></label>
          <input class="mono" id="suggested_env" name="suggested_env" value="{{.Metadata.SuggestedEnv}}" maxlength="128" placeholder="API_TOKEN" spellcheck="false">
        </div>
        <div class="field">
          <label for="value">Secret value</label>
          <input type="password" id="value" name="value" autocomplete="new-password" required>
        </div>
        {{if .ReplaceName}}<label class="confirm"><input type="checkbox" name="confirm" value="yes" required><span>Replace the saved value for <strong>{{.ReplaceName}}</strong></span></label>{{end}}
        <div class="actions"><button type="submit">Save credential</button><button class="secondary" type="submit" formaction="/cancel" formnovalidate>Cancel</button></div>
      </form>
    </section>
  </main>
</body>
</html>
